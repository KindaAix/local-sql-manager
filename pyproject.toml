[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-sql-manager"
version = "0.1.0"
description = "本地多维表格管理器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "openpyxl",
    "fastmcp",
    "pystray",
    "pillow",
]
classifiers = [
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]

[project.scripts]
local-sql-manager = "local_sql_manager.desktop.launcher:main"

[tool.setuptools.packages.find]
include = ["local_sql_manager*"]

[tool.setuptools.package-data]
local_sql_manager = ["templates/**/*.html", "static/**/*"]
